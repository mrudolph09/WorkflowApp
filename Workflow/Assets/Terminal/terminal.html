<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Workflow Terminal</title>
  <link rel="stylesheet" href="xterm.css" />
  <style>
    /* color-scheme: without it Chromium draws the viewport scrollbar in its light variant. */
    html, body { margin: 0; padding: 0; height: 100%; background: #1e1e1e; overflow: hidden; color-scheme: dark; }
    #terminal { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
